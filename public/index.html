<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S — English Coach</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#060a10">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JARVIS">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #060a10;
    --panel: #0c141d;
    --panel-line: #1c2b38;
    --cyan: #4fd8f0;
    --cyan-dim: #2a6b7c;
    --amber: #ffb454;
    --text: #dce7ec;
    --muted: #5f7a88;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background: radial-gradient(circle at 50% 20%, #0d1720 0%, #060a10 70%);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 32px 16px 60px;
  }
  header{ text-align:center; margin-bottom: 22px; }
  .brand{
    font-family:'Orbitron', sans-serif;
    font-weight:700;
    letter-spacing: 6px;
    font-size: 26px;
    color: var(--cyan);
    text-shadow: 0 0 18px rgba(79,216,240,0.5);
  }
  .brand span{color:var(--amber); text-shadow:0 0 18px rgba(255,180,84,0.5);}
  .subtitle{
    font-size:12px;
    letter-spacing:3px;
    color: var(--muted);
    margin-top:6px;
    text-transform:uppercase;
  }

  .level-select{ display:flex; gap:8px; margin-bottom: 18px; }
  .level-btn{
    background: transparent;
    border: 1px solid var(--panel-line);
    color: var(--muted);
    padding: 6px 14px;
    font-size: 12px;
    letter-spacing: 1px;
    border-radius: 2px;
    cursor: pointer;
    font-family:'Inter',sans-serif;
    transition: all .15s ease;
  }
  .level-btn.active{
    border-color: var(--cyan);
    color: var(--cyan);
    box-shadow: 0 0 12px rgba(79,216,240,0.25) inset;
  }

  /* --- トピック選択 --- */
  .topic-box{
    width:100%;
    max-width: 560px;
    margin-bottom: 22px;
  }
  .topic-label{
    font-size:11px;
    letter-spacing:2px;
    color: var(--muted);
    text-transform:uppercase;
    margin-bottom:8px;
    text-align:center;
  }
  .topic-chips{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    margin-bottom:10px;
  }
  .topic-chip{
    background: var(--panel);
    border: 1px solid var(--panel-line);
    color: var(--text);
    padding: 6px 12px;
    font-size: 12.5px;
    border-radius: 14px;
    cursor:pointer;
    font-family:'Inter',sans-serif;
    transition: all .15s ease;
  }
  .topic-chip.active{
    border-color: var(--amber);
    color: var(--amber);
    box-shadow: 0 0 10px rgba(255,180,84,0.2) inset;
  }
  .topic-custom-row{
    display:flex;
    gap:8px;
    justify-content:center;
    align-items:center;
  }
  .topic-custom-row input{
    background: var(--panel);
    border: 1px solid var(--panel-line);
    color: var(--text);
    padding: 7px 10px;
    font-size: 13px;
    border-radius: 4px;
    width: 220px;
    font-family:'Inter',sans-serif;
  }
  .topic-custom-row input:focus{ outline:none; border-color: var(--cyan-dim); }
  #startTopicBtn{
    background: transparent;
    border: 1px solid var(--cyan-dim);
    color: var(--cyan);
    padding: 7px 16px;
    font-size: 12.5px;
    border-radius: 4px;
    cursor:pointer;
    letter-spacing:1px;
    font-family:'Inter',sans-serif;
    transition: all .15s ease;
  }
  #startTopicBtn:hover{ border-color: var(--cyan); box-shadow: 0 0 10px rgba(79,216,240,0.2); }
  #startTopicBtn:disabled{ opacity:0.4; cursor:default; }
  .current-topic{
    text-align:center;
    font-size:12px;
    color: var(--amber);
    margin-top:8px;
    min-height: 16px;
  }

  .core-wrap{
    position:relative;
    width:220px;
    height:220px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom: 24px;
  }
  .ring{
    position:absolute;
    border-radius:50%;
    border: 1px solid var(--panel-line);
    pointer-events: none;
  }
  .ring.r1{ width:220px; height:220px; }
  .ring.r2{ width:180px; height:180px; border-color: var(--cyan-dim); }
  .ring.r3{ width:150px; height:150px; border-style:dashed; opacity:0.5; }
  .core-wrap.listening .ring{ border-color: var(--cyan); animation: spin 6s linear infinite; }
  .core-wrap.listening .ring.r2{ animation: spin 4s linear infinite reverse; }
  .core-wrap.speaking .ring{ border-color: var(--amber); }

  @keyframes spin{ to{ transform: rotate(360deg); } }
  @keyframes pulse{
    0%,100%{ box-shadow:0 0 20px rgba(79,216,240,0.4); }
    50%{ box-shadow:0 0 40px rgba(79,216,240,0.8); }
  }

  #micBtn{
    width:110px;
    height:110px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #12222b, #060a10 75%);
    border: 1px solid var(--cyan-dim);
    color: var(--cyan);
    font-size: 34px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: all .2s ease;
  }
  #micBtn:hover{ border-color: var(--cyan); }
  .core-wrap.listening #micBtn{ animation: pulse 1.4s ease-in-out infinite; border-color: var(--cyan); }
  .core-wrap.speaking #micBtn{ border-color: var(--amber); color: var(--amber); }

  .status{
    font-size: 11px;
    letter-spacing: 3px;
    text-transform:uppercase;
    color: var(--muted);
    margin-bottom: 24px;
    height:14px;
  }

  .panel{
    width: 100%;
    max-width: 560px;
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 4px;
    padding: 18px 20px;
    max-height: 340px;
    overflow-y: auto;
  }
  .panel::-webkit-scrollbar{ width:6px; }
  .panel::-webkit-scrollbar-thumb{ background: var(--panel-line); border-radius:3px; }

  .msg{ margin-bottom: 16px; line-height:1.55; font-size:14px; }
  .msg .who{ font-family:'Orbitron', sans-serif; font-size: 10px; letter-spacing:2px; margin-bottom: 3px; }
  .msg.user .who{ color: var(--amber); }
  .msg.ai .who{ color: var(--cyan); }
  .feedback{
    margin-top:6px;
    padding: 8px 10px;
    border-left: 2px solid var(--amber);
    background: rgba(255,180,84,0.06);
    font-size: 13px;
    color: #f0d9b5;
  }
  .better{
    margin-top:6px;
    padding: 8px 10px;
    border-left: 2px solid var(--cyan);
    background: rgba(79,216,240,0.06);
    font-size: 13px;
    color: #bdeefc;
    font-style: italic;
  }
  .empty-hint{ color: var(--muted); font-size: 13px; text-align:center; padding: 20px 0; }

  .panel-label{
    width:100%;
    max-width: 560px;
    font-size:11px;
    letter-spacing:2px;
    color: var(--muted);
    text-transform:uppercase;
    margin: 16px 0 8px;
    text-align:center;
  }
  .ja-panel{
    max-height: 200px;
  }
  .ja-panel .msg{ font-size:13.5px; }
  .ja-panel .msg.user .who{ color: var(--amber); }
  .ja-panel .msg.ai .who{ color: var(--cyan); }
</style>
</head>
<body>

<header>
  <div class="brand">J.<span>A</span>.R.V.I.S</div>
  <div class="subtitle">English Conversation Coach</div>
</header>

<div class="level-select" id="levelSelect">
  <button class="level-btn" data-level="beginner">初級</button>
  <button class="level-btn active" data-level="intermediate">中級</button>
  <button class="level-btn" data-level="advanced">上級</button>
</div>

<div class="topic-box">
  <div class="topic-label">Topic（任意）</div>
  <div class="topic-chips" id="topicChips">
    <div class="topic-chip" data-topic="Travel and vacations">旅行</div>
    <div class="topic-chip" data-topic="Daily life and routines">日常生活</div>
    <div class="topic-chip" data-topic="Work and career">仕事</div>
    <div class="topic-chip" data-topic="Hobbies and free time">趣味</div>
    <div class="topic-chip" data-topic="Food and restaurants">食べ物</div>
  </div>
  <div class="topic-custom-row">
    <input type="text" id="customTopic" placeholder="自由入力（英語/日本語どちらでもOK）">
    <button id="startTopicBtn">この話題で始める</button>
  </div>
  <div class="current-topic" id="currentTopicLabel"></div>
</div>

<div class="core-wrap" id="coreWrap">
  <div class="ring r1"></div>
  <div class="ring r2"></div>
  <div class="ring r3"></div>
  <button id="micBtn" title="クリックして話す">🎙</button>
</div>

<div class="status" id="statusText">タップして話しかけてください</div>

<div class="panel" id="chatPanel">
  <div class="empty-hint">マイクボタンを押すか、上でトピックを選んで会話を始めましょう</div>
</div>

<div class="panel-label">日本語訳（会話の流れ）</div>
<div class="panel ja-panel" id="jaPanel">
  <div class="empty-hint">ここに会話の日本語訳が表示されます</div>
</div>

<script>
const micBtn = document.getElementById('micBtn');
const coreWrap = document.getElementById('coreWrap');
const statusText = document.getElementById('statusText');
const chatPanel = document.getElementById('chatPanel');
const jaPanel = document.getElementById('jaPanel');
const levelSelect = document.getElementById('levelSelect');
const topicChips = document.getElementById('topicChips');
const customTopicInput = document.getElementById('customTopic');
const startTopicBtn = document.getElementById('startTopicBtn');
const currentTopicLabel = document.getElementById('currentTopicLabel');

let currentLevel = 'intermediate';
let selectedTopic = '';
let history = []; // Gemini形式の会話履歴
let isBusy = false;

// ▼▼ ここの数値(ミリ秒)を調整すると、話し終わりの判定タイミングが変わります ▼▼
// 大きくする = より長く沈黙を待ってから送信する（反応が遅くなる代わりに、話している途中で遮られにくくなる）
const SILENCE_TIMEOUT_MS = 1200;
// ▲▲ ---------------------------------------------------------- ▲▲

levelSelect.addEventListener('click', (e) => {
  const btn = e.target.closest('.level-btn');
  if (!btn) return;
  document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentLevel = btn.dataset.level;
});

topicChips.addEventListener('click', (e) => {
  const chip = e.target.closest('.topic-chip');
  if (!chip) return;
  document.querySelectorAll('.topic-chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  customTopicInput.value = '';
  selectedTopic = chip.dataset.topic;
});

customTopicInput.addEventListener('input', () => {
  if (customTopicInput.value.trim()) {
    document.querySelectorAll('.topic-chip').forEach(c => c.classList.remove('active'));
    selectedTopic = customTopicInput.value.trim();
  }
});

startTopicBtn.addEventListener('click', () => {
  if (!selectedTopic || isBusy) return;
  currentTopicLabel.textContent = `現在のトピック: ${selectedTopic}`;
  startTopicConversation(selectedTopic);
});

// --- 音声認識 (Web Speech API) ---
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let finalTranscript = '';
let silenceTimer = null;

if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.lang = 'en-US';
  recognition.continuous = true;      // 話し終わりを自分で判定するため連続認識にする
  recognition.interimResults = true;  // 話している途中の内容も受け取る
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    finalTranscript = '';
    coreWrap.classList.add('listening');
    statusText.textContent = 'LISTENING...';
  };

  recognition.onresult = (event) => {
    clearTimeout(silenceTimer);
    for (let i = event.resultIndex; i < event.results.length; i++) {
      if (event.results[i].isFinal) {
        finalTranscript += event.results[i][0].transcript + ' ';
      }
    }
    // 一定時間、新しい発話がなければ「話し終わった」とみなして認識を止める
    silenceTimer = setTimeout(() => {
      recognition.stop();
    }, SILENCE_TIMEOUT_MS);
  };

  recognition.onend = () => {
    coreWrap.classList.remove('listening');
    clearTimeout(silenceTimer);
    const text = finalTranscript.trim();
    if (text) sendMessage(text);
  };

  recognition.onerror = (e) => {
    coreWrap.classList.remove('listening');
    statusText.textContent = '聞き取れませんでした。もう一度お試しください';
  };
} else {
  statusText.textContent = 'このブラウザは音声入力に対応していません（Chrome推奨）';
  micBtn.disabled = true;
}

micBtn.addEventListener('click', () => {
  if (isBusy || !recognition) return;
  speechSynthesis.cancel();
  recognition.start();
});

// --- トピックで会話を開始 ---
async function startTopicConversation(topic) {
  isBusy = true;
  statusText.textContent = 'THINKING...';
  const kickoffMessage = `(system note: The user wants to start a conversation about "${topic}". Greet them briefly and ask one engaging opening question in English about this topic. Do not mention this note.)`;

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: kickoffMessage, history, level: currentLevel })
    });
    const data = await res.json();

    if (!res.ok) {
      statusText.textContent = 'エラーが発生しました';
      addMessage('ai', data.error || 'エラーが発生しました');
      isBusy = false;
      return;
    }

    history.push({ role: 'user', parts: [{ text: kickoffMessage }] });
    history.push({ role: 'model', parts: [{ text: data.reply }] });

    const { spoken, feedback, better, ja } = splitExtras(data.reply);
    addMessage('ai', spoken, feedback, better);
    if (ja) addTranslation('ai', ja);
    speak(spoken);
  } catch (err) {
    statusText.textContent = '通信エラーです';
    isBusy = false;
  }
}

// --- チャット送信 ---
async function sendMessage(text) {
  isBusy = true;
  addMessage('user', text);
  statusText.textContent = 'THINKING...';

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, history, level: currentLevel })
    });
    const data = await res.json();

    if (!res.ok) {
      statusText.textContent = 'エラーが発生しました';
      addMessage('ai', data.error || 'エラーが発生しました');
      isBusy = false;
      return;
    }

    history.push({ role: 'user', parts: [{ text }] });
    history.push({ role: 'model', parts: [{ text: data.reply }] });

    const { spoken, feedback, better, ja, userJa } = splitExtras(data.reply);
    if (userJa) addTranslation('user', userJa);
    addMessage('ai', spoken, feedback, better);
    if (ja) addTranslation('ai', ja);
    speak(spoken);
  } catch (err) {
    statusText.textContent = '通信エラーです';
    isBusy = false;
  }
}

function splitExtras(raw) {
  const tags = ['FEEDBACK', 'BETTER', 'JA', 'USER_JA'];
  let text = raw;
  const result = {};

  for (const tag of tags) {
    const idx = text.indexOf(`[${tag}]`);
    if (idx === -1) { result[tag] = null; continue; }
    const start = idx + tag.length + 2; // "[TAG]" の長さ分
    let end = text.length;
    for (const t2 of tags) {
      const idx2 = text.indexOf(`[${t2}]`, start);
      if (idx2 !== -1 && idx2 < end) end = idx2;
    }
    result[tag] = text.slice(start, end).trim();
    text = (text.slice(0, idx) + text.slice(end)).trim();
  }

  return {
    spoken: text.trim(),
    feedback: result.FEEDBACK,
    better: result.BETTER,
    ja: result.JA,
    userJa: result.USER_JA
  };
}

function addMessage(role, text, feedback, better) {
  const hint = chatPanel.querySelector('.empty-hint');
  if (hint) hint.remove();

  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = `
    <div class="who">${role === 'user' ? 'YOU' : 'JARVIS'}</div>
    <div>${escapeHtml(text)}</div>
    ${feedback ? `<div class="feedback">💡 ${escapeHtml(feedback)}</div>` : ''}
    ${better ? `<div class="better">✨ More natural: “${escapeHtml(better)}”</div>` : ''}
  `;
  chatPanel.appendChild(div);
  chatPanel.scrollTop = chatPanel.scrollHeight;
}

function addTranslation(role, text) {
  const hint = jaPanel.querySelector('.empty-hint');
  if (hint) hint.remove();

  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = `
    <div class="who">${role === 'user' ? 'YOU' : 'JARVIS'}</div>
    <div>${escapeHtml(text)}</div>
  `;
  jaPanel.appendChild(div);
  jaPanel.scrollTop = jaPanel.scrollHeight;
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

// --- 音声出力 (SpeechSynthesis API) ---
function speak(text) {
  coreWrap.classList.add('speaking');
  statusText.textContent = 'SPEAKING...';
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';
  utter.rate = 0.98;
  utter.onend = () => {
    coreWrap.classList.remove('speaking');
    statusText.textContent = 'タップして話しかけてください';
    isBusy = false;
  };
  speechSynthesis.speak(utter);
}

// --- PWA: Service Workerを登録 ---
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}

</script>
</body>
</html>
